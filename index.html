<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="img/icon_pokebola.png" />
    <link rel="stylesheet" type="text/css" href="./css/style.css" />
    <title>Pokedex | Projeto Portfólio</title>
  </head>
  <body>
    <h1 id="id_main"></h1>
    <section class="input">
      <input type="number" name="" id="inputId" />
      <button id="btnEntre"><img id="lupaBtn" src="./img/lupa.png"></button>
    </section>
    <section id="main-container">
      <button id="btnVoltar" class="btnSeta"><img class="btnImg" id="back" src="./img/next.png"></button>
      <section id="pokemon">
        <img alt="Sprite do Pokemon" id="sprite" />
        <section id="tipo_container"></section>
      </section>
      <section id="pokemon_status">
        <p id="nome"></p>
        <p id="id"></p>
      </section>
      <button id="btnAvancar" class="btnSeta"><img class="btnImg"src="./img/next.png"></button>
    </section>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
